<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SEBELAH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <script src="login.js"></script>
</head>
<body>
  <div class="auth-container">
    <!-- Left Side - Branding -->
   <div class="auth-left">
  <div class="auth-hero">
    <h1 class="hero-title">SEBELAH</h1>
    <span class="hero-sub">Sarana Transportasi Anda!</span>
    <p class="hero-desc">
      Kami menyediakan layanan transportasi Dalam kota sekitar Jabodetabek 
      dan Antar Kota Antar Provinsi (AKAP) serta layanan pariwisata dengan armada bus besar, bus 
      medium dan bus kecil/elf terbaru dan berkualitas.
    </p>

    <div class="hero-frame">
    <img src="bus_sebelah-removebg.png" alt="AmbaSmart illustration" class="hero-img">
    </div>
  </div>
</div>
    
    <!-- Right Side - Login Form -->
    <div class="auth-right">
      <div class="auth-form-container">
        <div class="auth-form-header">
          <h2>Selamat Datang!</h2>
          <p>Daftar untuk masuk</p>
        </div>
        
        <form id="loginForm" action="admin.html">
          <div class="form-group">
            <label for="email">Alamat email anda</label>
            <input type="email" id="email" placeholder="name@company.com" required>
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-input">
              <input type="password" id="password" placeholder="••••••••" required>
              <button type="button" class="password-toggle">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          
          <button type="submit" class="btn-primary">masuk</button>
        </form>
        
      </div>
    </div>
  </div>
  
  <script src="login.js"></script>
</body>
</html>
